<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人社公共服务平台 · 失业登记</title><style>body{margin:0;background:#f3f6f8;color:#20343b;font-family:"Microsoft YaHei",system-ui,sans-serif}header{background:#0e5a62;color:#fff;padding:18px 5%}main{max-width:920px;margin:24px auto}.card{background:#fff;border:1px solid #dce7e9;border-radius:10px;padding:24px 30px}h1{margin:8px 0;font-size:25px}h2{font-size:18px;border-left:4px solid #0e7b82;padding-left:10px}.steps{display:flex;gap:8px}.step{flex:1;padding:10px;background:#e8eff0;border-radius:6px;font-size:13px}.active{background:#d5eff0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}label{display:flex;flex-direction:column;gap:6px;font-weight:600}input,select{padding:10px;border:1px solid #bfd0d3;border-radius:6px;font:inherit}.required{color:#c23b3b}.actions{margin-top:24px;display:flex;justify-content:space-between}button{background:#0e6b72;color:#fff;border:0;border-radius:6px;padding:11px 24px;font-weight:700}@media(max-width:700px){main{margin:12px}.grid{grid-template-columns:1fr}}</style></head><body><header><div>人力资源和社会保障公共服务平台　/　就业服务　/　失业登记</div><h1>失业登记申请</h1></header><main><div class="card"><div class="steps"><div class="step active">1 核对信息</div><div class="step">2 填写失业信息</div><div class="step">3 补充材料</div><div class="step">4 提交申请</div></div><p>这是独立的模拟业务系统页面。Agent 仅协助填写；提交前请核对信息。</p><form id="applicationForm"><h2>申请人信息</h2><div class="grid"><label>姓名 *<input name="full_name" id="full_name" readonly></label><label>联系电话 *<input name="phone" id="phone"></label><label>失业日期 *<input type="date" name="unemployment_date" id="unemployment_date"></label><label>失业原因 *<select name="unemployment_reason" id="unemployment_reason"><option value="">请选择</option><option value="contract_ended">劳动合同终止</option><option value="layoff">单位裁员</option><option value="resignation">主动离职</option><option value="other">其他</option></select></label><label>上次工作单位 *<input name="last_employer" id="last_employer"></label><label>现居住地址 *<input name="current_address" id="current_address"></label></div><h2>材料</h2><label>解除或终止劳动关系证明 *<input type="file" name="unemployment_proof" id="unemployment_proof"></label><div class="actions"><span id="agentStatus">等待 Agent 或您填写信息</span><button type="submit">提交申请</button></div></form></div></main><script>const form=document.querySelector('#applicationForm'),params=new URLSearchParams(location.search),status=document.querySelector('#agentStatus');['full_name','phone','unemployment_date','unemployment_reason','last_employer','current_address'].forEach(key=>{if(params.get(key))document.querySelector('#'+key).value=params.get(key)});window.addEventListener('message',e=>{if(e.data?.type!=='agent-form-state')return;Object.entries(e.data.fields||{}).forEach(([key,value])=>{const input=document.querySelector('#'+key);if(input){input.value=value;input.style.outline='2px solid #1a8f83';setTimeout(()=>input.style.outline='',1400);status.textContent='Agent 已填写：'+key+'，请您核对。'}})});form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const r=await fetch('/api/unemployment-registration/submit',{method:'POST',body:new FormData(form)}),j=await r.json();status.textContent=j.message+' 申请编号：'+j.application_no;parent.postMessage({type:'mock-business-submitted',message:status.textContent},'*')})</script></body></html>
