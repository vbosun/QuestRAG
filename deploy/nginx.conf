map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ ^/(auth|applications|browser|chat|documents|evaluations|permissions|public-services|system|health)(/|$) {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
    location ~ ^/(employment-registration|unemployment-registration)(/|$) {
        proxy_pass http://mock-business:8020;
        proxy_set_header Host $http_host;
    }
    location = /form-bridge.js {
        proxy_pass http://mock-business:8020;
        proxy_set_header Host $http_host;
    }
    location ~ ^/api/(employment-registration|unemployment-registration)/submit$ {
        proxy_pass http://mock-business:8020;
        proxy_set_header Host $http_host;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
